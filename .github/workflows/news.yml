name: Policy News Bot

on:
  workflow_dispatch:
    inputs:
      daily_report:
        description: '평소엔 그냥 combined로 두고 Run workflow만 누르세요. none은 예전 방식(기사 1건당 메시지 1개, 전체 카테고리) 테스트용이라 한 번에 여러 통이 옵니다.'
        required: false
        default: 'combined'
        type: choice
        options: ['combined', 'climate', 'paju', 'assembly', 'none']
  schedule:
    # 아침 08:00 1회. 기후에너지환경노동+파주시+국회입법 3개 트랙을 하나로 묶어
    # 텔레그램 메시지로 보낸다(run_daily_combined). 하루 중 이 한 번만 자동 실행된다.
    - cron: '0 8 * * 1-5'
      timezone: Asia/Seoul
    # 예전에는 실시간 상시 배치(매시 07분)와 트랙별 개별 리포트(게임·외교·기후·파주
    # 각각 다른 시각)가 함께 돌아서 하루에도 여러 번, 한 번에 7~8건씩 알림이 왔다.
    # 지금은 위 08:00 통합 브리핑 한 번만 자동으로 온다. 예전 방식으로 되돌리려면
    # 아래 줄들을 되살리고 news_bot_v4.py 의 DAILY_SCHEDULE 도 함께 맞추면 된다:
    #   - cron: '7 5-23 * * 1-5'
    #     timezone: Asia/Seoul
    #   - cron: '7 5,8,11,14,17,20,23 * * 0,6'
    #     timezone: Asia/Seoul
    #   - cron: '30 18 * * 1-5'
    #     timezone: Asia/Seoul

permissions:
  contents: write

concurrency:
  group: policy-news-delivery
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Collect and send news
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_POLICY_CHAT_ID: ${{ secrets.TELEGRAM_POLICY_CHAT_ID }}
          TELEGRAM_CLIMATE_CHAT_ID: ${{ secrets.TELEGRAM_CLIMATE_CHAT_ID }}
          TELEGRAM_PAJU_CHAT_ID: ${{ secrets.TELEGRAM_PAJU_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_RULE: ${{ github.event.schedule }}
          RUN_DAILY: ${{ inputs.daily_report }}
        run: python -X utf8 runner.py
